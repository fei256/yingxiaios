{
  "settings": {
    "base": {
      "DEVELOPMENT_TEAM": "",
      "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator26.[2-9]*]": "$(inherited) TVBOX_SDK26_1",
      "CURRENT_PROJECT_VERSION": "1",
      "ICLOUD_ENTITLEMENTS": "",
      "GENERATE_INFOPLIST_FILE": true,
      "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator2[7-9]*]": "$(inherited) TVBOX_SDK26_1 TVBOX_SDK27",
      "MARKETING_VERSION": "1.8.13",
      "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator[3-9]*]": "$(inherited) TVBOX_SDK26_1 TVBOX_SDK27",
      "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator26.1*]": "$(inherited) TVBOX_SDK26_1",
      "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos2[7-9]*]": "$(inherited) TVBOX_SDK26_1 TVBOX_SDK27",
      "INFOPLIST_KEY_CFBundleDisplayName": "映匣",
      "INFOPLIST_KEY_LSApplicationCategoryType": "public.app-category.entertainment",
      "SWIFT_VERSION": "6.0",
      "CODE_SIGN_STYLE": "Automatic",
      "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos[3-9]*]": "$(inherited) TVBOX_SDK26_1 TVBOX_SDK27",
      "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos26.[2-9]*]": "$(inherited) TVBOX_SDK26_1",
      "ENABLE_USER_SCRIPT_SANDBOXING": false,
      "OTHER_SWIFT_FLAGS": "$(inherited) -Xfrontend -disable-dynamic-actor-isolation",
      "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos26.1*]": "$(inherited) TVBOX_SDK26_1",
      "IPHONEOS_DEPLOYMENT_TARGET": "16.1"
    }
  },
  "targets": {
    "TVBox-iOS": {
      "productName": "映匣",
      "info": {
        "properties": {
          "BGTaskSchedulerPermittedIdentifiers": [
            "$(PRODUCT_BUNDLE_IDENTIFIER).downloads.*"
          ],
          "UIApplicationSceneManifest": {
            "UISceneConfigurations": {
              "UIWindowSceneSessionRoleExternalDisplayNonInteractive": [
                {
                  "UISceneDelegateClassName": "ExternalDisplaySceneDelegate",
                  "UISceneConfigurationName": "External Display"
                }
              ]
            },
            "UIApplicationSupportsMultipleScenes": false
          },
          "ITSAppUsesNonExemptEncryption": false,
          "LSSupportsOpeningDocumentsInPlace": true,
          "CADisableMinimumFrameDurationOnPhone": true,
          "UISupportedInterfaceOrientations": [
            "UIInterfaceOrientationPortrait",
            "UIInterfaceOrientationLandscapeLeft",
            "UIInterfaceOrientationLandscapeRight"
          ],
          "NSPhotoLibraryAddUsageDescription": "Save login QR codes and video screenshots to your photo library when you choose to save them.",
          "UISupportedInterfaceOrientations~ipad": [
            "UIInterfaceOrientationPortrait",
            "UIInterfaceOrientationPortraitUpsideDown",
            "UIInterfaceOrientationLandscapeLeft",
            "UIInterfaceOrientationLandscapeRight"
          ],
          "CFBundleURLTypes": [
            {
              "CFBundleURLName": "com.jo32.yingxia.ios.compare.handoff",
              "CFBundleURLSchemes": [
                "yingxia-compare"
              ]
            }
          ]
        }
      },
      "preBuildScripts": [
        {
          "name": "Embed Dandanplay API configuration",
          "script": "\"$SRCROOT/Scripts/embed-dandanplay-config.py\"",
          "basedOnDependencyAnalysis": false
        }
      ],
      "platform": "iOS",
      "sources": [
        {
          "path": "App"
        },
        {
          "path": "Runtime/AppleRuntime/Native/ApplePython.c"
        },
        {
          "path": "Config/iOS/Assets.xcassets"
        },
        {
          "buildPhase": "resources",
          "path": "Config/iOS/PrivacyInfo.xcprivacy"
        }
      ],
      "postBuildScripts": [
        {
          "basedOnDependencyAnalysis": false,
          "name": "Embed on-device Python runtime",
          "script": "\"$SRCROOT/Scripts/embed-apple-python.sh\""
        },
        {
          "name": "Embed on-device Node runtime",
          "script": "\"$SRCROOT/Scripts/embed-node-mobile.sh\"",
          "basedOnDependencyAnalysis": false
        }
      ],
      "settings": {
        "base": {
          "OTHER_LDFLAGS": "$(inherited) -lc++ -lz -liconv -framework Security -framework CoreGraphics -framework Accelerate -framework CoreML",
          "PRODUCT_NAME": "映匣",
          "PRODUCT_MODULE_NAME": "TVBox_iOS",
          "PRODUCT_BUNDLE_IDENTIFIER": "com.jo32.yingxia.ios.compare",
          "MARKETING_VERSION": "1.8.14",
          "CURRENT_PROJECT_VERSION": "51",
          "INFOPLIST_KEY_CFBundleDisplayName": "映匣",
          "TARGETED_DEVICE_FAMILY": "1,2",
          "ENABLE_USER_SCRIPT_SANDBOXING": false,
          "ASSETCATALOG_COMPILER_APPICON_NAME": "AppIcon",
          "ENABLE_DEBUG_DYLIB": false,
          "CODE_SIGN_ENTITLEMENTS": "$(ICLOUD_ENTITLEMENTS)",
          "ARCHS": "arm64",
          "LD_GENERATE_MAP_FILE": "YES",
          "LD_MAP_FILE_PATH": "$(SRCROOT)/build/ipa/ios-linkmap.txt"
        },
        "configs": {
          "Release": {
            "SWIFT_COMPILATION_MODE": "singlefile",
            "SWIFT_ENABLE_INCREMENTAL_COMPILATION": true,
            "SWIFT_ENABLE_BATCH_MODE": true,
            "SWIFT_OPTIMIZATION_LEVEL": "-O",
            "LOCAL_SWIFT_JOBS": "4",
            "OTHER_SWIFT_FLAGS": "$(inherited) -j$(LOCAL_SWIFT_JOBS)"
          }
        }
      },
      "dependencies": [
        {
          "framework": "Vendor/NativeASR/TVASR.xcframework",
          "embed": false
        }
      ],
      "templates": [
        "SharedApp"
      ]
    }
  },
  "options": {
    "knownRegions": [
      "en",
      "zh-Hans",
      "zh-Hant",
      "ja"
    ],
    "deploymentTarget": {
      "iOS": "16.1"
    },
    "bundleIdPrefix": "com.tvbox",
    "developmentLanguage": "en"
  },
  "packages": {
    "Perception": {
      "url": "https://github.com/pointfreeco/swift-perception",
      "exactVersion": "2.0.10"
    },
    "TVCore": {
      "path": "Packages/TVCore"
    }
  },
  "targetTemplates": {
    "SharedApp": {
      "sources": [
        {
          "path": "App"
        },
        {
          "path": "website/public/releases.json",
          "buildPhase": "resources"
        }
      ],
      "type": "application",
      "dependencies": [
        {
          "package": "TVCore"
        },
        {
          "package": "Perception"
        },
        {
          "package": "TVCore",
          "product": "KSPlayer"
        }
      ],
      "info": {
        "properties": {
          "CFBundleLocalizations": [
            "en",
            "zh-Hans",
            "zh-Hant",
            "ja"
          ],
          "NSAppTransportSecurity": {
            "NSAllowsArbitraryLoads": true
          },
          "UIBackgroundModes": [
            "audio"
          ],
          "NSLocalNetworkUsageDescription": "Connect to your media servers and subscription services on the local network, and discover other devices running 映匣.",
          "CFBundleDisplayName": "映匣",
          "CFBundleName": "映匣",
          "NSBonjourServices": [
            "_yingxia._tcp"
          ],
          "CFBundleDevelopmentRegion": "en",
          "UILaunchScreen": {}
        },
        "path": "Config/Info-${target_name}.plist"
      }
    }
  },
  "name": "Yingxia-iOS"
}
