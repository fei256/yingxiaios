name: Build iOS IPA
run-name: Build unsigned iOS IPA ${{ inputs.build_number || github.run_number }}

on:
  workflow_dispatch:
    inputs:
      test_runner:
        description: 'Runner for native interface checks'
        required: false
        default: macos-15
        type: choice
        options: [macos-15, macos-15-intel]
      build_ipa:
        description: 'Build IPA as well as native interface checks'
        required: false
        default: true
        type: boolean
      journal_preview_only:
        description: 'Run only the portrait journal layout and screenshot check'
        required: false
        default: false
        type: boolean
      build_number:
        description: 'Build number (leave empty to use the workflow run number)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ios-ipa.yml'
      - 'App/**'
      - 'Config/**'
      - 'Packages/**'
      - 'Runtime/**'
      - 'Scripts/**'
      - 'Tests/BuildPipeline/**'
      - 'Tests/DetailAppearance/**'
      - 'Tests/PlaybackCache/**'
      - 'Tests/TMDB/**'
      - 'Sources/**'
      - 'Vendor/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'project.yml'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: ios-ipa-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.build_ipa == false && 'interface-only' || 'full' }}
  cancel-in-progress: false

jobs:
  metadata-tests:
    if: github.event_name != 'workflow_dispatch' || !inputs.journal_preview_only
    runs-on: ${{ inputs.test_runner || 'macos-15' }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - name: Test native TMDB requests, enrichment and failure recovery
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          mkdir -p build/ci
          xcrun swiftc -swift-version 6 -parse-as-library \
            Sources/TVCore/TMDBCatalogModels.swift Sources/TVCore/TMDBServiceSettings.swift \
            Sources/TVCore/TMDBNetworkTransport.swift Sources/TVCore/TMDBConnectionDiagnostics.swift \
            Sources/TVCore/TMDBMatch.swift Sources/TVCore/TMDBTitleMatching.swift \
            Sources/TVCore/LocalDetailEpisodeNumbers.swift Sources/TVCore/CustomTMDBService.swift \
            Tests/TMDB/Support.swift Tests/TMDB/checks.swift -o build/ci/tmdb-checks
          build/ci/tmdb-checks build/ci/tmdb-checks.json 2>&1 | tee build/ci/tmdb-checks.log
      - name: Test completed cache timeline coverage
        run: |
          xcrun swiftc -swift-version 6 -parse-as-library Sources/TVCore/PlaybackCacheProgress.swift \
            Tests/PlaybackCache/progress.swift -o build/ci/cache-progress-checks
          build/ci/cache-progress-checks 2>&1 | tee build/ci/cache-progress-checks.log
          node --test Tests/TMDB/transport.test.mjs 2>&1 | tee build/ci/tmdb-transport-checks.log
      - name: Upload metadata and cache test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: TMDB-cache-checks-${{ github.run_id }}
          path: |
            build/ci/tmdb-checks.*
            build/ci/cache-progress-checks.log
            build/ci/tmdb-transport-checks.log
          retention-days: 14
          if-no-files-found: ignore
  native-tests:
    runs-on: ${{ inputs.test_runner || 'macos-15' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      JOURNAL_PREVIEW_ONLY: ${{ inputs.journal_preview_only && 'true' || 'false' }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false

      - name: Prepare installed simulator tools
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list runtimes
          brew install xcodegen

      - name: Check measured watching activity
        run: |
          mkdir -p build/ci
          xcrun swiftc -swift-version 6 -parse-as-library Sources/TVCore/PlaybackWatchActivity.swift \
            Tests/WatchActivity/checks.swift -o build/ci/watch-activity-checks
          build/ci/watch-activity-checks 2>&1 | tee build/ci/watch-activity-checks.log

      - name: Test native search input, controls and journal calendar
        id: native_tests
        timeout-minutes: 20
        run: |
          mkdir -p build/ci/search-input
          python3 Tests/SearchInput/prepare-symbol-audit.py
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          base = Path('Tests/SearchInput').resolve()
          source = (base / 'project.yml').read_text()
          def absolute(match):
              path = (base / match.group(2).strip()).resolve(strict=True)
              return match.group(1) + json.dumps(str(path))
          source = re.sub(r'(?m)^([ ]*- path: )(.+)$', absolute, source)
          Path('build/ci/search-input/project.yml').write_text(source)
          PY
          xcodegen generate --spec build/ci/search-input/project.yml --project build/ci/search-input
          python3 - <<'PY'
          import json, os, plistlib, subprocess
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '--json']))['runtimes']
          runtime = next(x for x in runtimes if x.get('isAvailable') and x.get('version') == '18.5')
          types = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devicetypes', '--json']))['devicetypes']
          device = next(x for x in types if x['name'] == 'iPad (10th generation)')
          identifier = subprocess.check_output(['xcrun', 'simctl', 'create', 'Yingxia Input Checks', device['identifier'], runtime['identifier']], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SEARCH_INPUT_SIMULATOR=' + identifier + '\n')
          with open('build/ci/search-input/simulator-id.txt', 'w') as output:
              output.write(identifier + '\n')
          with open('build/ci/search-input/Info.plist', 'wb') as output:
              plistlib.dump({
                  'CFBundleIdentifier': '$(PRODUCT_BUNDLE_IDENTIFIER)',
                  'CFBundleExecutable': '$(EXECUTABLE_NAME)',
                  'CFBundleName': '$(PRODUCT_NAME)',
                  'CFBundlePackageType': 'APPL',
                  'CFBundleVersion': '1',
                  'CFBundleShortVersionString': '1.0',
                  'UIDeviceFamily': [1, 2],
                  'UILaunchScreen': {},
                  'UIApplicationSceneManifest': {'UIApplicationSupportsMultipleScenes': False, 'UISceneConfigurations': {}},
                  'UISupportedInterfaceOrientations': ['UIInterfaceOrientationPortrait', 'UIInterfaceOrientationLandscapeLeft', 'UIInterfaceOrientationLandscapeRight'],
                  'UISupportedInterfaceOrientations~ipad': ['UIInterfaceOrientationPortrait', 'UIInterfaceOrientationPortraitUpsideDown', 'UIInterfaceOrientationLandscapeLeft', 'UIInterfaceOrientationLandscapeRight'],
              }, output)
          PY
          read -r SEARCH_INPUT_SIMULATOR < build/ci/search-input/simulator-id.txt
          test -n "$SEARCH_INPUT_SIMULATOR"
          python3 - <<'PY'
          import os, subprocess
          identifier = os.environ.get('SEARCH_INPUT_SIMULATOR')
          if not identifier:
              identifier = open('build/ci/search-input/simulator-id.txt').read().strip()
          print('Booting input test simulator', flush=True)
          subprocess.run(['xcrun', 'simctl', 'boot', identifier], check=True, timeout=60)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', identifier, '-b'], check=True, timeout=240)
          print('Input test simulator booted', flush=True)
          PY
          ci_test_options=()
          if [[ "$JOURNAL_PREVIEW_ONLY" == 'true' ]]; then
            ci_test_options+=('-only-testing:ControlHitTests/JournalInteractionTests/testPortraitJournalLayoutFitsAndScreenshot')
          fi
          xcodebuild test -project build/ci/search-input/SearchInputChecks.xcodeproj -scheme SearchInputChecks \
            -destination "platform=iOS Simulator,id=$SEARCH_INPUT_SIMULATOR" -destination-timeout 60 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 \
            -parallel-testing-enabled NO -derivedDataPath build/ci/search-input-derived \
            -resultBundlePath build/ci/search-input-results.xcresult CODE_SIGNING_ALLOWED=NO "${ci_test_options[@]}" \
            2>&1 | tee build/ci/search-input-tests.log

      - name: Capture journal directly from the simulator
        if: success() && steps.native_tests.outcome == 'success' && env.SEARCH_INPUT_SIMULATOR != ''
        run: |
          mkdir -p build/ci/search-input-attachments
          xcrun simctl launch --terminate-running-process "$SEARCH_INPUT_SIMULATOR" com.yingxia.search-input-checks journal
          sleep 2
          xcrun simctl io "$SEARCH_INPUT_SIMULATOR" screenshot --type=png build/ci/search-input-attachments/journal-simulator.png

      - name: Shut down input test simulator
        if: always() && env.SEARCH_INPUT_SIMULATOR != ''
        run: |
          xcrun simctl shutdown "$SEARCH_INPUT_SIMULATOR" || true
          xcrun simctl delete "$SEARCH_INPUT_SIMULATOR" || true

      - name: Export native test attachments
        if: always()
        run: |
          if test -d build/ci/search-input-results.xcresult; then
            mkdir -p build/ci/search-input-attachments
            xcrun xcresulttool export attachments --path build/ci/search-input-results.xcresult --output-path build/ci/search-input-attachments/xcresult
          fi

      - name: Upload native test diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: native-input-controls-build${{ inputs.build_number || github.run_number }}-${{ github.run_attempt }}
          path: |
            build/ci/search-input-tests.log
            build/ci/watch-activity-checks.log
            build/ci/search-input-results.xcresult
            build/ci/search-input-attachments
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6

  detail-tests:
    if: github.event_name != 'workflow_dispatch' || !inputs.journal_preview_only
    runs-on: ${{ inputs.test_runner || 'macos-15' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - name: Prepare native detail layout host
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          brew install xcodegen
          python3 Tests/DetailAppearance/prepare-native-checks.py
          xcodegen generate --spec build/ci/detail-native/project.json --project build/ci/detail-native
          python3 - <<'PY'
          import json, os, subprocess
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '--json']))['runtimes']
          runtime = next(x for x in runtimes if x.get('isAvailable') and x.get('version') == '18.5')
          device = 'com.apple.CoreSimulator.SimDeviceType.iPad-10th-generation'
          identifier = subprocess.check_output(['xcrun', 'simctl', 'create', 'Yingxia Detail Checks', device, runtime['identifier']], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('DETAIL_TEST_SIMULATOR=' + identifier + '\n')
          subprocess.run(['xcrun', 'simctl', 'boot', identifier], check=True, timeout=60)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', identifier, '-b'], check=True, timeout=240)
          PY
      - name: Test detail artwork, action targets and actual cache track paint
        run: |
          xcodebuild test -project build/ci/detail-native/DetailChecks.xcodeproj -scheme DetailChecks \
            -destination "platform=iOS Simulator,id=$DETAIL_TEST_SIMULATOR" -destination-timeout 60 \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 \
            -derivedDataPath build/ci/detail-native-derived -resultBundlePath build/ci/detail-native-results.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ci/detail-native-tests.log
      - name: Export detail screenshots and shut down simulator
        if: always()
        run: |
          if test -d build/ci/detail-native-results.xcresult; then
            xcrun xcresulttool export attachments --path build/ci/detail-native-results.xcresult \
              --output-path build/ci/detail-native-attachments
          fi
          if test -n "$DETAIL_TEST_SIMULATOR"; then
            xcrun simctl shutdown "$DETAIL_TEST_SIMULATOR" || true
            xcrun simctl delete "$DETAIL_TEST_SIMULATOR" || true
          fi
      - name: Upload detail visual regression results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: Detail-native-checks-${{ github.run_id }}
          path: |
            build/ci/detail-native-tests.log
            build/ci/detail-native-attachments
          retention-days: 14
          if-no-files-found: ignore

  legacy-ui-tests:
    if: github.event_name != 'workflow_dispatch' || !inputs.journal_preview_only
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - name: Install and verify the iOS 16.1 simulator runtime
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          brew install xcodegen
          mkdir -p build/ci
          python3 Scripts/prepare-ios-platform.py --runtime-only --version 16.1 \
            --report build/ci/ios16.1-runtime.json 2>&1 | tee build/ci/ios16.1-runtime.log
      - name: Prepare production component hosts for iOS 16.1
        run: |
          python3 Tests/DetailAppearance/prepare-native-checks.py
          python3 Tests/SearchInput/prepare-symbol-audit.py
          xcodegen generate --spec build/ci/detail-native/project.json --project build/ci/detail-native
          python3 - <<'PY'
          from pathlib import Path
          import json, os, plistlib, re, subprocess
          base = Path('Tests/SearchInput').resolve()
          folder = Path('build/ci/search-input'); folder.mkdir(parents=True, exist_ok=True)
          source = (base / 'project.yml').read_text()
          source = re.sub(r'(?m)^([ ]*- path: )(.+)$', lambda m: m.group(1) + json.dumps(str((base / m.group(2).strip()).resolve(strict=True))), source)
          (folder / 'project.yml').write_text(source)
          with (folder / 'Info.plist').open('wb') as output:
              orientations = ['UIInterfaceOrientationPortrait', 'UIInterfaceOrientationLandscapeLeft', 'UIInterfaceOrientationLandscapeRight']
              plistlib.dump({'CFBundleIdentifier': '$(PRODUCT_BUNDLE_IDENTIFIER)', 'CFBundleExecutable': '$(EXECUTABLE_NAME)',
                  'CFBundleName': '$(PRODUCT_NAME)', 'CFBundlePackageType': 'APPL', 'CFBundleVersion': '1',
                  'CFBundleShortVersionString': '1.0', 'UIDeviceFamily': [1, 2], 'UILaunchScreen': {},
                  'UIApplicationSceneManifest': {'UIApplicationSupportsMultipleScenes': False, 'UISceneConfigurations': {}},
                  'UISupportedInterfaceOrientations': orientations, 'UISupportedInterfaceOrientations~ipad': orientations}, output)
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '--json']))['runtimes']
          runtime = next(x for x in runtimes if x.get('isAvailable') and x.get('version') == '16.1' and 'iOS' in x['name'])
          identifier = subprocess.check_output(['xcrun', 'simctl', 'create', 'Yingxia iOS 16.1 Checks',
              'com.apple.CoreSimulator.SimDeviceType.iPad-10th-generation', runtime['identifier']], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('LEGACY_TEST_SIMULATOR=' + identifier + '\n')
          subprocess.run(['xcrun', 'simctl', 'boot', identifier], check=True, timeout=60)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', identifier, '-b'], check=True, timeout=240)
          PY
          xcodegen generate --spec build/ci/search-input/project.yml --project build/ci/search-input
      - name: Test input and controls on iOS 16.1
        run: |
          xcodebuild test -project build/ci/search-input/SearchInputChecks.xcodeproj -scheme SearchInputChecks \
            -destination "platform=iOS Simulator,id=$LEGACY_TEST_SIMULATOR" -destination-timeout 60 \
            -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 300 -derivedDataPath build/ci/legacy-input-derived \
            -resultBundlePath build/ci/legacy-input-results.xcresult CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/ci/legacy-input-tests.log
      - name: Test detail paint on iOS 16.1
        if: success() || failure()
        run: |
          xcodebuild test -project build/ci/detail-native/DetailChecks.xcodeproj -scheme DetailChecks \
            -destination "platform=iOS Simulator,id=$LEGACY_TEST_SIMULATOR" -destination-timeout 60 \
            -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 -derivedDataPath build/ci/legacy-detail-derived \
            -resultBundlePath build/ci/legacy-detail-results.xcresult CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/ci/legacy-detail-tests.log
      - name: Export iOS 16.1 screenshots and release simulator
        if: always()
        run: |
          for kind in input detail; do
            if test -d "build/ci/legacy-$kind-results.xcresult"; then
              xcrun xcresulttool export attachments --path "build/ci/legacy-$kind-results.xcresult" \
                --output-path "build/ci/legacy-$kind-attachments"
            fi
          done
          if test -n "$LEGACY_TEST_SIMULATOR"; then
            xcrun simctl shutdown "$LEGACY_TEST_SIMULATOR" || true
            xcrun simctl delete "$LEGACY_TEST_SIMULATOR" || true
          fi
      - name: Upload iOS 16.1 test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: iOS16.1-native-checks-${{ github.run_id }}
          path: |
            build/ci/ios16.1-runtime.*
            build/ci/legacy-*-tests.log
            build/ci/legacy-*-attachments
          retention-days: 14
          if-no-files-found: ignore

  build:
    needs: metadata-tests
    if: github.event_name != 'workflow_dispatch' || inputs.build_ipa
    runs-on: macos-15-intel
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      TVBOX_CACHE: ${{ github.workspace }}/build/download-cache
      CI_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false

      - name: Check source layout and regression cases
        run: |
          mkdir -p build/ci
          python3 Scripts/preflight-ios-source.py --report build/ci/source-preflight.json
          python3 -m unittest discover -s Tests/BuildPipeline -v 2>&1 | tee build/ci/pipeline-tests.log

      - name: Check playback cache and range recovery
        run: |
          node --version
          node --test Tests/PlaybackCache/forward-cache.test.mjs

      - name: Check build environment
        run: |
          mkdir -p build/ci
          ci_xcode_path=/Applications/Xcode_16.4.app/Contents/Developer
          test -d "$ci_xcode_path" || { echo 'Xcode 16.4 is missing from this runner image.' >&2; exit 1; }
          sudo xcode-select --switch "$ci_xcode_path"
          # Cache extraction changes device/inode IDs even when file content and mtime match.
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          defaults read com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges
          xcrun simctl list > /dev/null
          python3 - <<'PY'
          import os
          import re
          number = os.environ['CI_BUILD_NUMBER']
          if not re.fullmatch(r'[1-9][0-9]*', number):
              raise SystemExit('Build number must be a positive integer.')
          PY
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk iphoneos --show-sdk-version
          brew install xcodegen ripgrep pkgconf
          xcodegen --version

      - name: Compute stable cache fingerprints and build concurrency
        id: cache-keys
        run: python3 Scripts/ci-build-cache.py keys --report build/ci/cache-keys.json

      - name: Type-check native drag provider
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('App/LocalSettingsReorderRow.swift').read_text()
          marker = 'private struct LocalSettingsRowFrames:'
          if source.count(marker) != 1 or 'enum LocalSettingsReorderProvider' not in source:
              raise SystemExit('Drag provider preflight needs updating for the current source layout.')
          provider = source.split(marker, 1)[0].replace('import TVCore\n', '')
          Path('build/ci/reorder-provider.swift').write_text(provider)
          PY
          xcrun swiftc -typecheck -swift-version 6 -target arm64-apple-ios16.1 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" build/ci/reorder-provider.swift

      - name: Check home navigation and settings surfaces
        run: |
          xcrun swiftc -swift-version 6 App/LocalHomeSourceSelection.swift App/LocalHomeNavigationState.swift \
            Sources/TVCore/LocalDockLayout.swift Tests/NavigationState/main.swift -o build/ci/navigation-state-checks
          build/ci/navigation-state-checks
          xcrun swiftc -typecheck -swift-version 6 -target arm64-apple-ios16.1 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" App/LocalSettingsAppearance.swift
          xcrun swiftc -frontend -parse -swift-version 6 -target arm64-apple-ios16.1 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" App/*.swift

      - name: Check search suggestions and input
        run: |
          xcrun swiftc -swift-version 6 -parse-as-library Sources/TVCore/SearchSuggestions.swift \
            Tests/SearchSuggestions/checks.swift -o build/ci/search-suggestion-checks
          build/ci/search-suggestion-checks
          xcrun swiftc -typecheck -swift-version 6 -target arm64-apple-ios16.1 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" App/GlobalSearchInput.swift

      - name: Check detail layout across iPhone and iPad
        run: |
          xcrun swiftc -swift-version 6 -parse-as-library App/CatalogDetailMetrics.swift \
            Tests/DetailAppearance/checks.swift -o build/ci/detail-layout-checks
          build/ci/detail-layout-checks

      - name: Check measured watching activity
        run: |
          xcrun swiftc -swift-version 6 -parse-as-library Sources/TVCore/PlaybackWatchActivity.swift \
            Tests/WatchActivity/checks.swift -o build/ci/watch-activity-checks
          build/ci/watch-activity-checks 2>&1 | tee build/ci/watch-activity-checks.log

      - name: Verify preinstalled iOS 18.5 platform
        run: |
          python3 Scripts/prepare-ios-platform.py --version 18.5 --report build/ci/platform-check.json \
            2>&1 | tee build/ci/ios-platform.log

      - name: Restore native dependencies
        id: native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          key: ios-native-v3-${{ runner.os }}-${{ runner.arch }}-xcode16.4-${{ steps.cache-keys.outputs.native }}
          path: |
            build/tools
            build/download-cache
            build/downloads
            build/apple-python
            build/ApplePython
            build/AV3A
            build/AVSNative
            build/Disc
            build/FFmpeg
            build/NativeASR
            Vendor/NativeASR/sources
            Vendor/NativeASR/TVASR.xcframework
            Vendor/AVSNative/sources
            Vendor/DiscNative/sources

      - name: Restore compiled app and project
        id: build-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          key: ios-build-v1-${{ runner.os }}-${{ runner.arch }}-xcode16.4-jobs${{ env.JOBS }}-${{ steps.cache-keys.outputs.native }}-${{ steps.cache-keys.outputs.settings }}-${{ github.sha }}
          restore-keys: ios-build-v1-${{ runner.os }}-${{ runner.arch }}-xcode16.4-jobs${{ env.JOBS }}-${{ steps.cache-keys.outputs.native }}-${{ steps.cache-keys.outputs.settings }}-
          path: |
            build/DerivedData-iOS16
            build/ios-project.json
            build/ios-project.xcodegen-cache
            build/ci/source-timestamps.json
            Yingxia-iOS.xcodeproj

      - name: Restore timestamps of unchanged tracked sources
        run: python3 Scripts/ci-build-cache.py restore-timestamps --report build/ci/timestamp-restore.json

      - name: Select pinned Python build interpreter
        run: |
          ci_host_python="$(bash Scripts/fetch-build-python.sh)"
          echo "HOST_PYTHON=$ci_host_python" >> "$GITHUB_ENV"

      - name: Prepare pinned iOS dependencies
        run: |
          python3 - <<'PY' 2>&1 | tee build/ci/dependencies.log
          import subprocess
          import sys
          import time
          command = [sys.executable, 'Scripts/prepare-ios-dependencies.py',
                     '--fetch-av3a', '--skip-package-resolution']
          for attempt in range(1, 4):
              result = subprocess.run(command)
              if result.returncode == 0:
                  break
              if attempt == 3:
                  raise SystemExit(result.returncode)
              print(f'Dependency preparation failed; retrying attempt {attempt + 1}/3.', flush=True)
              time.sleep(15)
          PY

      - name: Save native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
          path: |
            build/tools
            build/download-cache
            build/downloads
            build/apple-python
            build/ApplePython
            build/AV3A
            build/AVSNative
            build/Disc
            build/FFmpeg
            build/NativeASR
            Vendor/NativeASR/sources
            Vendor/NativeASR/TVASR.xcframework
            Vendor/AVSNative/sources
            Vendor/DiscNative/sources

      - name: Restore pinned Swift packages
        id: swift-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          key: ios-swift-v1-${{ runner.os }}-${{ runner.arch }}-xcode16.4-${{ hashFiles('Package.resolved') }}
          path: build/SourcePackages

      - name: Resolve pinned Swift packages
        run: |
          for ci_attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -project Yingxia-iOS.xcodeproj \
              -scheme TVBox-iOS -clonedSourcePackagesDirPath build/SourcePackages \
              -onlyUsePackageVersionsFromResolvedFile 2>&1 | tee build/ci/swift-packages.log; then
              break
            fi
            test "$ci_attempt" -lt 3 || exit 1
            sleep 15
          done

      - name: Save pinned Swift packages
        if: steps.swift-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
          path: build/SourcePackages

      - name: Build and validate unsigned IPA
        run: |
          python3 Scripts/build-ios-ipa.py --check --build-number "$CI_BUILD_NUMBER" --jobs "$JOBS"
          python3 Scripts/build-ios-ipa.py --build-number "$CI_BUILD_NUMBER" --jobs "$JOBS" 2>&1 | tee build/ci/build.log

      - name: Record source timestamps for the next build
        run: python3 Scripts/ci-build-cache.py save-timestamps --report build/ci/timestamp-save.json

      - name: Save compiled app and project
        if: steps.build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
          path: |
            build/DerivedData-iOS16
            build/ios-project.json
            build/ios-project.xcodegen-cache
            build/ci/source-timestamps.json
            Yingxia-iOS.xcodeproj

      - name: Upload IPA and validation reports
        id: ipa-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: Yingxia-iOS-build${{ env.CI_BUILD_NUMBER }}-unsigned
          path: |
            artifacts/latest/*.ipa
            artifacts/latest/SHA256SUMS.txt
            artifacts/latest/ipa-delivery.json
            artifacts/latest/ipa-validation.json
            artifacts/latest/player-validation.json
            artifacts/latest/native-deployment.json
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

      - name: Write download summary
        env:
          IPA_ARTIFACT_URL: ${{ steps.ipa-artifact.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('artifacts/latest/ipa-delivery.json').read_text())
          text = (f"## Yingxia {report['version']} / build {report['build']}\n\n"
                  f"[Download IPA and validation reports]({os.environ['IPA_ARTIFACT_URL']})\n\n"
                  f"Minimum iOS: {report['minimum_ios']}. The IPA is unsigned; sign it before installation.\n\n"
                  f"IPA size: {report['bytes'] / 1024**2:.1f} MiB. Large compiler logs are in the separate diagnostics artifact.\n\n"
                  f"Source commit: `{report['source_commit']}`. Validation covers linked binaries; device playback still needs testing.\n\n"
                  f"SHA-256: `{report['sha256']}`\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(text)
          PY

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: iOS-build${{ env.CI_BUILD_NUMBER }}-logs-${{ github.run_attempt }}
          path: |
            build/ci/*.log
            build/ci/*.json
            build/ipa/*.log
            build/ipa/*.json
            build/ipa/*.txt
            build/apple-python/**/*.log
            build/FFmpeg/**/*.log
            build/AV3A/**/*.log
            build/AVSNative/**/*.log
            build/Disc/**/*.log
            build/NativeASR/**/*.log
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6
