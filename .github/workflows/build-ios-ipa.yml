name: Build iOS IPA
run-name: Build unsigned iOS IPA ${{ inputs.build_number || github.run_number }}

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave empty to use the workflow run number)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ios-ipa.yml'
      - 'App/**'
      - 'Config/**'
      - 'Packages/**'
      - 'Runtime/**'
      - 'Scripts/**'
      - 'Sources/**'
      - 'Vendor/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'project.yml'

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      JOBS: '2'
      TVBOX_CACHE: ${{ github.workspace }}/build/download-cache
      CI_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check build environment
        run: |
          mkdir -p build/ci
          ci_xcode_path=/Applications/Xcode_16.1.app/Contents/Developer
          test -d "$ci_xcode_path" || { echo 'Xcode 16.1 is missing from this runner image.' >&2; exit 1; }
          sudo xcode-select --switch "$ci_xcode_path"
          xcrun simctl list > /dev/null
          python3 - <<'PY'
          import os
          import re
          number = os.environ['CI_BUILD_NUMBER']
          if not re.fullmatch(r'[1-9][0-9]*', number):
              raise SystemExit('Build number must be a positive integer.')
          PY
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install xcodegen ripgrep pkgconf

      - name: Restore iOS 18.1 platform package
        id: platform-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ios-platform-18.1-${{ runner.os }}-${{ runner.arch }}-v1
          path: build/ios-platform-cache

      - name: Install iOS 18.1 platform
        id: ios-platform
        run: |
          python3 - <<'PY' 2>&1 | tee build/ci/ios-platform.log
          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '--json']))['runtimes']
          if any(runtime.get('version') == '18.1' and runtime.get('isAvailable')
                 and 'iOS' in runtime.get('name', '') for runtime in runtimes):
              print('iOS 18.1 platform is already installed.')
              raise SystemExit(0)
          folder = Path('build/ios-platform-cache')
          folder.mkdir(parents=True, exist_ok=True)
          archives = list(folder.rglob('*.dmg'))
          if not archives:
              command = ['xcodebuild', '-downloadPlatform', 'iOS', '-buildVersion', '18.1',
                         '-exportPath', str(folder.resolve())]
              for attempt in range(1, 4):
                  result = subprocess.run(command)
                  if result.returncode == 0:
                      break
                  if attempt == 3:
                      raise SystemExit(result.returncode)
                  time.sleep(15)
              archives = list(folder.rglob('*.dmg'))
          if len(archives) != 1:
              raise SystemExit('Expected exactly one iOS 18.1 platform package.')
          subprocess.run(['xcodebuild', '-importPlatform', str(archives[0].resolve())], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('cacheable=true\n')
          PY

      - name: Save iOS 18.1 platform package
        if: steps.platform-cache.outputs.cache-hit != 'true' && steps.ios-platform.outputs.cacheable == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.platform-cache.outputs.cache-primary-key }}
          path: build/ios-platform-cache

      - name: Restore native dependencies
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ios-native-v1-${{ runner.os }}-${{ runner.arch }}-xcode16.1-${{ hashFiles('Scripts/**', 'Vendor/**', 'Runtime/PythonHost/**', 'Config/Python/**', 'Package.resolved') }}
          path: |
            build/tools
            build/download-cache
            build/downloads
            build/apple-python
            build/ApplePython
            build/AV3A
            build/AVSNative
            build/Disc
            build/FFmpeg
            build/NativeASR
            build/SourcePackages
            Vendor/NativeASR/sources
            Vendor/NativeASR/TVASR.xcframework
            Vendor/AVSNative/sources
            Vendor/DiscNative/sources

      - name: Select pinned Python build interpreter
        run: |
          ci_host_python="$(bash Scripts/fetch-build-python.sh)"
          echo "HOST_PYTHON=$ci_host_python" >> "$GITHUB_ENV"

      - name: Prepare pinned iOS dependencies
        run: |
          python3 - <<'PY' 2>&1 | tee build/ci/dependencies.log
          import json
          from pathlib import Path
          import subprocess
          import sys
          import time
          lock = json.loads(Path('Vendor/AV3A/SOURCE-INVENTORY.json').read_text())
          archive = Path('build/downloads/av3a-' + lock['commit'] + '.tar.gz')
          archive.parent.mkdir(parents=True, exist_ok=True)
          if not archive.is_file():
              url = lock['repository'].replace('https://github.com/', 'https://codeload.github.com/') + '/tar.gz/' + lock['commit']
              subprocess.run(['curl', '--fail', '--location', '--retry', '3', '--connect-timeout', '30',
                              '--max-time', '1800', '--output', str(archive), url], check=True)
          command = [sys.executable, 'Scripts/prepare-ios-dependencies.py',
                     '--av3a-archive', str(archive), '--skip-package-resolution']
          for attempt in range(1, 4):
              result = subprocess.run(command)
              if result.returncode == 0:
                  break
              if attempt == 3:
                  raise SystemExit(result.returncode)
              print(f'Dependency preparation failed; retrying attempt {attempt + 1}/3.', flush=True)
              time.sleep(15)
          PY

      - name: Save native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
          path: |
            build/tools
            build/download-cache
            build/downloads
            build/apple-python
            build/ApplePython
            build/AV3A
            build/AVSNative
            build/Disc
            build/FFmpeg
            build/NativeASR
            build/SourcePackages
            Vendor/NativeASR/sources
            Vendor/NativeASR/TVASR.xcframework
            Vendor/AVSNative/sources
            Vendor/DiscNative/sources

      - name: Resolve pinned Swift packages
        run: |
          for ci_attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -project Yingxia-iOS.xcodeproj \
              -scheme TVBox-iOS -clonedSourcePackagesDirPath build/SourcePackages \
              -onlyUsePackageVersionsFromResolvedFile 2>&1 | tee build/ci/swift-packages.log; then
              break
            fi
            test "$ci_attempt" -lt 3 || exit 1
            sleep 15
          done

      - name: Build and validate unsigned IPA
        run: |
          python3 Scripts/build-ios-ipa.py --check --build-number "$CI_BUILD_NUMBER" --jobs "$JOBS"
          python3 Scripts/build-ios-ipa.py --build-number "$CI_BUILD_NUMBER" --jobs "$JOBS" 2>&1 | tee build/ci/build.log

      - name: Upload IPA and validation reports
        id: ipa-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Yingxia-iOS-build${{ env.CI_BUILD_NUMBER }}-unsigned
          path: artifacts/latest/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

      - name: Write download summary
        env:
          IPA_ARTIFACT_URL: ${{ steps.ipa-artifact.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('artifacts/latest/ipa-delivery.json').read_text())
          text = (f"## Yingxia {report['version']} / build {report['build']}\n\n"
                  f"[Download IPA and validation reports]({os.environ['IPA_ARTIFACT_URL']})\n\n"
                  f"Minimum iOS: {report['minimum_ios']}. The IPA is unsigned; sign it before installation.\n\n"
                  f"SHA-256: `{report['sha256']}`\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(text)
          PY

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iOS-build${{ env.CI_BUILD_NUMBER }}-logs-${{ github.run_attempt }}
          path: |
            build/ci/*.log
            build/ipa/*.log
            build/ipa/*.json
            build/ipa/*.txt
            build/apple-python/**/*.log
            build/FFmpeg/**/*.log
            build/AV3A/**/*.log
            build/AVSNative/**/*.log
            build/Disc/**/*.log
            build/NativeASR/**/*.log
          if-no-files-found: ignore
          retention-days: 14
