name: Build iOS IPA
run-name: Build unsigned iOS IPA ${{ inputs.build_number || github.run_number }}

on:
  workflow_dispatch:
    inputs:
      build_ipa:
        description: 'Build IPA as well as native interface checks'
        required: false
        default: true
        type: boolean
      build_number:
        description: 'Build number (leave empty to use the workflow run number)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ios-ipa.yml'
      - 'App/**'
      - 'Config/**'
      - 'Packages/**'
      - 'Runtime/**'
      - 'Scripts/**'
      - 'Tests/BuildPipeline/**'
      - 'Sources/**'
      - 'Vendor/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'project.yml'

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-tests:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false

      - name: Prepare installed simulator tools
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list runtimes
          brew install xcodegen

      - name: Test native search input and control hit areas
        timeout-minutes: 20
        run: |
          mkdir -p build/ci/search-input
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          base = Path('Tests/SearchInput').resolve()
          source = (base / 'project.yml').read_text()
          def absolute(match):
              path = (base / match.group(2).strip()).resolve(strict=True)
              return match.group(1) + json.dumps(str(path))
          source = re.sub(r'(?m)^([ ]*- path: )(.+)$', absolute, source)
          Path('build/ci/search-input/project.yml').write_text(source)
          PY
          xcodegen generate --spec build/ci/search-input/project.yml --project build/ci/search-input
          python3 - <<'PY'
          import json, os, plistlib, subprocess
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '--json']))['runtimes']
          runtime = next(x for x in runtimes if x.get('isAvailable') and x.get('version') == '18.5')
          types = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devicetypes', '--json']))['devicetypes']
          device = next(x for x in types if x['name'] == 'iPad (10th generation)')
          identifier = subprocess.check_output(['xcrun', 'simctl', 'create', 'Yingxia Input Checks', device['identifier'], runtime['identifier']], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SEARCH_INPUT_SIMULATOR=' + identifier + '\n')
          with open('build/ci/search-input/simulator-id.txt', 'w') as output:
              output.write(identifier + '\n')
          with open('build/ci/search-input/Info.plist', 'wb') as output:
              plistlib.dump({
                  'CFBundleIdentifier': '$(PRODUCT_BUNDLE_IDENTIFIER)',
                  'CFBundleExecutable': '$(EXECUTABLE_NAME)',
                  'CFBundleName': '$(PRODUCT_NAME)',
                  'CFBundlePackageType': 'APPL',
                  'CFBundleVersion': '1',
                  'CFBundleShortVersionString': '1.0',
                  'UIDeviceFamily': [1, 2],
                  'UILaunchScreen': {},
                  'UIApplicationSceneManifest': {'UIApplicationSupportsMultipleScenes': False, 'UISceneConfigurations': {}},
                  'UISupportedInterfaceOrientations': ['UIInterfaceOrientationPortrait', 'UIInterfaceOrientationLandscapeLeft', 'UIInterfaceOrientationLandscapeRight'],
              }, output)
          PY
          read -r SEARCH_INPUT_SIMULATOR < build/ci/search-input/simulator-id.txt
          test -n "$SEARCH_INPUT_SIMULATOR"
          python3 - <<'PY'
          import os, subprocess
          identifier = os.environ.get('SEARCH_INPUT_SIMULATOR')
          if not identifier:
              identifier = open('build/ci/search-input/simulator-id.txt').read().strip()
          print('Booting input test simulator', flush=True)
          subprocess.run(['xcrun', 'simctl', 'boot', identifier], check=True, timeout=60)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', identifier, '-b'], check=True, timeout=240)
          print('Input test simulator booted', flush=True)
          PY
          xcodebuild test -project build/ci/search-input/SearchInputChecks.xcodeproj -scheme SearchInputChecks \
            -destination "platform=iOS Simulator,id=$SEARCH_INPUT_SIMULATOR" -destination-timeout 60 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 \
            -parallel-testing-enabled NO -derivedDataPath build/ci/search-input-derived \
            -resultBundlePath build/ci/search-input-results.xcresult CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/ci/search-input-tests.log

      - name: Shut down input test simulator
        if: always() && env.SEARCH_INPUT_SIMULATOR != ''
        run: |
          xcrun simctl shutdown "$SEARCH_INPUT_SIMULATOR" || true
          xcrun simctl delete "$SEARCH_INPUT_SIMULATOR" || true

      - name: Export native test attachments
        if: always()
        run: |
          if test -d build/ci/search-input-results.xcresult; then
            xcrun xcresulttool export attachments --path build/ci/search-input-results.xcresult --output-path build/ci/search-input-attachments
          fi

      - name: Upload native test diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: native-input-controls-build${{ inputs.build_number || github.run_number }}-${{ github.run_attempt }}
          path: |
            build/ci/search-input-tests.log
            build/ci/search-input-results.xcresult
            build/ci/search-input-attachments
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.build_ipa
    runs-on: macos-15-intel
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      JOBS: '2'
      TVBOX_CACHE: ${{ github.workspace }}/build/download-cache
      CI_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false

      - name: Check source layout and regression cases
        run: |
          mkdir -p build/ci
          python3 Scripts/preflight-ios-source.py --report build/ci/source-preflight.json
          python3 -m unittest discover -s Tests/BuildPipeline -v 2>&1 | tee build/ci/pipeline-tests.log

      - name: Check build environment
        run: |
          mkdir -p build/ci
          ci_xcode_path=/Applications/Xcode_16.1.app/Contents/Developer
          test -d "$ci_xcode_path" || { echo 'Xcode 16.1 is missing from this runner image.' >&2; exit 1; }
          sudo xcode-select --switch "$ci_xcode_path"
          xcrun simctl list > /dev/null
          python3 - <<'PY'
          import os
          import re
          number = os.environ['CI_BUILD_NUMBER']
          if not re.fullmatch(r'[1-9][0-9]*', number):
              raise SystemExit('Build number must be a positive integer.')
          PY
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install xcodegen ripgrep pkgconf
          xcodegen --version

      - name: Type-check native drag provider
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('App/LocalSettingsReorderRow.swift').read_text()
          marker = 'private struct LocalSettingsRowFrames:'
          if source.count(marker) != 1 or 'enum LocalSettingsReorderProvider' not in source:
              raise SystemExit('Drag provider preflight needs updating for the current source layout.')
          provider = source.split(marker, 1)[0].replace('import TVCore\n', '')
          Path('build/ci/reorder-provider.swift').write_text(provider)
          PY
          xcrun swiftc -typecheck -swift-version 6 -target arm64-apple-ios16.2 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" build/ci/reorder-provider.swift

      - name: Check home navigation and settings surfaces
        run: |
          xcrun swiftc -swift-version 6 App/LocalHomeSourceSelection.swift App/LocalHomeNavigationState.swift \
            Sources/TVCore/LocalDockLayout.swift Tests/NavigationState/main.swift -o build/ci/navigation-state-checks
          build/ci/navigation-state-checks
          xcrun swiftc -typecheck -swift-version 6 -target arm64-apple-ios16.2 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" App/LocalSettingsAppearance.swift
          xcrun swiftc -frontend -parse -swift-version 6 -target arm64-apple-ios16.2 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" App/*.swift

      - name: Check search suggestions and input
        run: |
          xcrun swiftc -swift-version 6 -parse-as-library Sources/TVCore/SearchSuggestions.swift \
            Tests/SearchSuggestions/checks.swift -o build/ci/search-suggestion-checks
          build/ci/search-suggestion-checks
          xcrun swiftc -typecheck -swift-version 6 -target arm64-apple-ios16.2 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" App/GlobalSearchInput.swift

      - name: Restore iOS 18.1 platform package
        id: platform-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          key: ios-platform-18.1-${{ runner.os }}-${{ runner.arch }}-v2
          restore-keys: ios-platform-18.1-${{ runner.os }}-${{ runner.arch }}-v1
          path: build/ios-platform-cache

      - name: Install iOS 18.1 platform
        id: ios-platform
        run: |
          python3 Scripts/prepare-ios-platform.py --version 18.1 --report build/ci/platform-check.json \
            2>&1 | tee build/ci/ios-platform.log

      - name: Save iOS 18.1 platform package
        if: steps.platform-cache.outputs.cache-hit != 'true' && steps.ios-platform.outputs.cacheable == 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          key: ${{ steps.platform-cache.outputs.cache-primary-key }}
          path: build/ios-platform-cache

      - name: Restore native dependencies
        id: native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          key: ios-native-v2-${{ runner.os }}-${{ runner.arch }}-xcode16.1-${{ hashFiles('Scripts/**', 'Vendor/**', 'Runtime/PythonHost/**', 'Config/Python/**', 'Package.resolved') }}
          path: |
            build/tools
            build/download-cache
            build/downloads
            build/apple-python
            build/ApplePython
            build/AV3A
            build/AVSNative
            build/Disc
            build/FFmpeg
            build/NativeASR
            Vendor/NativeASR/sources
            Vendor/NativeASR/TVASR.xcframework
            Vendor/AVSNative/sources
            Vendor/DiscNative/sources

      - name: Select pinned Python build interpreter
        run: |
          ci_host_python="$(bash Scripts/fetch-build-python.sh)"
          echo "HOST_PYTHON=$ci_host_python" >> "$GITHUB_ENV"

      - name: Prepare pinned iOS dependencies
        run: |
          python3 - <<'PY' 2>&1 | tee build/ci/dependencies.log
          import subprocess
          import sys
          import time
          command = [sys.executable, 'Scripts/prepare-ios-dependencies.py',
                     '--fetch-av3a', '--skip-package-resolution']
          for attempt in range(1, 4):
              result = subprocess.run(command)
              if result.returncode == 0:
                  break
              if attempt == 3:
                  raise SystemExit(result.returncode)
              print(f'Dependency preparation failed; retrying attempt {attempt + 1}/3.', flush=True)
              time.sleep(15)
          PY

      - name: Save native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
          path: |
            build/tools
            build/download-cache
            build/downloads
            build/apple-python
            build/ApplePython
            build/AV3A
            build/AVSNative
            build/Disc
            build/FFmpeg
            build/NativeASR
            Vendor/NativeASR/sources
            Vendor/NativeASR/TVASR.xcframework
            Vendor/AVSNative/sources
            Vendor/DiscNative/sources

      - name: Restore pinned Swift packages
        id: swift-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          key: ios-swift-v1-${{ runner.os }}-${{ runner.arch }}-xcode16.1-${{ hashFiles('Package.resolved') }}
          path: build/SourcePackages

      - name: Resolve pinned Swift packages
        run: |
          for ci_attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -project Yingxia-iOS.xcodeproj \
              -scheme TVBox-iOS -clonedSourcePackagesDirPath build/SourcePackages \
              -onlyUsePackageVersionsFromResolvedFile 2>&1 | tee build/ci/swift-packages.log; then
              break
            fi
            test "$ci_attempt" -lt 3 || exit 1
            sleep 15
          done

      - name: Save pinned Swift packages
        if: steps.swift-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
          path: build/SourcePackages

      - name: Build and validate unsigned IPA
        run: |
          python3 Scripts/build-ios-ipa.py --check --build-number "$CI_BUILD_NUMBER" --jobs "$JOBS"
          python3 Scripts/build-ios-ipa.py --build-number "$CI_BUILD_NUMBER" --jobs "$JOBS" 2>&1 | tee build/ci/build.log

      - name: Upload IPA and validation reports
        id: ipa-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: Yingxia-iOS-build${{ env.CI_BUILD_NUMBER }}-unsigned
          path: |
            artifacts/latest/*.ipa
            artifacts/latest/SHA256SUMS.txt
            artifacts/latest/ipa-delivery.json
            artifacts/latest/ipa-validation.json
            artifacts/latest/player-validation.json
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

      - name: Write download summary
        env:
          IPA_ARTIFACT_URL: ${{ steps.ipa-artifact.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('artifacts/latest/ipa-delivery.json').read_text())
          text = (f"## Yingxia {report['version']} / build {report['build']}\n\n"
                  f"[Download IPA and validation reports]({os.environ['IPA_ARTIFACT_URL']})\n\n"
                  f"Minimum iOS: {report['minimum_ios']}. The IPA is unsigned; sign it before installation.\n\n"
                  f"IPA size: {report['bytes'] / 1024**2:.1f} MiB. Large compiler logs are in the separate diagnostics artifact.\n\n"
                  f"Source commit: `{report['source_commit']}`. Validation covers linked binaries; device playback still needs testing.\n\n"
                  f"SHA-256: `{report['sha256']}`\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(text)
          PY

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: iOS-build${{ env.CI_BUILD_NUMBER }}-logs-${{ github.run_attempt }}
          path: |
            build/ci/*.log
            build/ci/*.json
            build/ipa/*.log
            build/ipa/*.json
            build/ipa/*.txt
            build/apple-python/**/*.log
            build/FFmpeg/**/*.log
            build/AV3A/**/*.log
            build/AVSNative/**/*.log
            build/Disc/**/*.log
            build/NativeASR/**/*.log
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6
